name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: devops-cicd-assignment-abhishek-2026
  CLOUDFRONT_DISTRIBUTION_ID: E102T5W2OWYF74

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required website files are present."

      - name: Validate HTML
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML validation passed."

      - name: Test completed
        run: echo "Test stage completed successfully."


  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p dist
          cp index.html dist/
          cp style.css dist/
          cp script.js dist/

          cd dist
          zip -r ../website-package.zip .
          cd ..

          echo "Deployment package created:"
          ls -lh website-package.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-package
          path: website-package.zip


  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::592068277508:role/devops-cicd-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "website-package.zip" \
            --exclude "*.md" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --region us-east-1 \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment completed
        run: |
          echo "Website deployed successfully."
          echo "S3 bucket: ${{ env.S3_BUCKET }}"
          echo "CloudFront distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "CloudFront URL: https://d1iea5undj5ot.cloudfront.net/"